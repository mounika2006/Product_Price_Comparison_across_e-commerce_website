<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 40px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
      animation: fadeIn 0.4s ease-in-out;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      background: linear-gradient(135deg,#667eea,#764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;
    }

    thead {
      background: linear-gradient(135deg,#667eea,#764ba2);
    }

    th {
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 16px;
      text-transform: uppercase;
    }

    td {
      padding: 16px;
      font-size: 14px;
      color: #444;
      border-bottom: 1px solid #eee;
    }

    tbody tr {
      transition: all 0.2s ease;
    }

    tbody tr:hover {
      background: #f3f4ff;
      transform: scale(1.01);
    }

    .role-admin {
      color: #2e7d32;
      font-weight: 700;
      background: rgba(46,125,50,0.1);
      padding: 6px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    .role-user {
      color: #455a64;
      font-weight: 600;
      background: rgba(69,90,100,0.1);
      padding: 6px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    .email {
      font-size: 13px;
      color: #666;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      body {
        padding: 20px;
      }
      table {
        font-size: 12px;
      }
      td, th {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Admin Dashboard — Users</h1>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Gender</th>
        <th>Address</th>
        <th>Role</th>
        <th>Age</th>
        <th>Email</th>
      </tr>
    </thead>

    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.gender }}</td>
        <td>{{ user.address }}</td>
        <td>
          <span class="role-{{ user.role }}">{{ user.role }}</span>
        </td>
        <td>{{ user.age }}</td>
        <td class="email">{{ user.mail }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
