<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up - PriceCompare</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* SIGNUP CARD same style as login */
    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 40px 36px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.2);
      animation: fadeIn 0.4s ease-out;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: #f7f9fc;
      border-radius: 12px;
      border: 1px solid rgba(6,78,122,0.08);
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #667eea;
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(102,126,234,0.12);
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s ease;
      box-shadow: 0 14px 30px rgba(102,126,234,0.22);
    }

    .signup-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(102,126,234,0.3);
    }

    .login-link {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      color: #333;
    }

    .login-link a {
      font-weight: 700;
      color: blue;
      text-decoration: underline;
    }

    .error-msg {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(255,230,230,0.9);
      color: #b00020;
      border-radius: 10px;
      border: 1px solid rgba(176,0,32,0.12);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .card { padding: 28px; }
      .row { flex-direction: column; gap: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Create Account</h1>

    <form action="{{ url_for('signup') }}" method="post">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="mail" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="row">
        <div class="form-group" style="flex:1;">
          <label>Age</label>
          <input type="number" name="age" min="13" max="120" required>
        </div>

        <div class="form-group" style="flex:1;">
          <label>Gender</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
  <label>Role</label>
  <select name="role" required>
    <option value="">Select Role</option>
    <option value="user">User</option>
    <option value="admin">Admin</option>
  </select>
</div>


      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" placeholder="123 Main St, City" required>
      </div>

      <button type="submit" class="signup-btn">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account?
      <a href="{{ url_for('login') }}">Login</a>
    </div>

    {% if msg %}
      <div class="error-msg">{{ msg }}</div>
    {% endif %}
  </div>

</body>
</html>
