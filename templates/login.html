<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - PriceCompare</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* LOGIN CARD styled like profile.html */
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 40px 36px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 24px;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #f7f9fc;
      border-radius: 12px;
      border: 1px solid rgba(6,78,122,0.08);
      outline: none;
      transition: 0.2s ease;
      font-size: 15px;
    }

    .form-group input:focus {
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 8px 28px rgba(102,126,234,0.12);
      transform: translateY(-2px);
    }

    .login-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s ease;
      box-shadow: 0 14px 30px rgba(102,126,234,0.22);
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(102,126,234,0.3);
    }

    .signup-text {
      margin-top: 16px;
      font-size: 14px;
      color: #444;
    }

    .signup-text a {
      color: #fff;
      font-weight: 600;
      text-decoration: underline;
    }

    .error-msg {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(255,230,230,0.9);
      color: #b00020;
      border-radius: 10px;
      border: 1px solid rgba(176,0,32,0.12);
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Login</h1>

    <form method="POST" action="{{ url_for('login') }}">

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="mail" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="signup-text">
      Don't have an account?
      <a href="{{ url_for('signup') }}">Sign up</a>
    </div>

    {% if msg %}
      <div class="error-msg">{{ msg }}</div>
    {% endif %}

  </div>

</body>
</html>
